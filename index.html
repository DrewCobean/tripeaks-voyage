async function famSync(){
  if(!famOn())return;
  if(famBusy){famAgain=true;return}
  famBusy=true;famMsg="";
  try{
    const res=await fetch(famUrl(""),{cache:"no-store"});if(!res.ok)throw new Error("read "+res.status);
    const R=(await res.json())||{},RP=R.players||{},RD=R.dead||{};
    stampPlayers();S.dead=S.dead||{};
    let chg=false;const jobs=[];
    for(const id in RD)if(!(S.dead[id]>=RD[id]))S.dead[id]=RD[id];
    for(const id in S.dead){const lp=S.p[id];if(lp&&(lp.u||0)<=S.dead[id]&&P!==lp){delete S.p[id];delete SIGS[id];chg=true}}
    for(const id in RP){
      const rp=RP[id],lp=S.p[id],dt=S.dead[id]||0;
      if(dt&&(rp.u||0)<=dt)continue;
      if(!lp){S.p[id]=Object.assign({},rp,{cur:null});SIGS[id]=psig(S.p[id]);chg=true;continue}
      if((rp.u||0)>(lp.u||0)){
        if(P===lp&&g&&!g.over)continue;
        const cur=lp.cur;for(const k of Object.keys(lp))delete lp[k];Object.assign(lp,rp);lp.cur=cur;SIGS[id]=psig(lp);chg=true;
      }
    }
    for(const id in S.p){const lp=S.p[id],rp=RP[id];if(!rp||(lp.u||0)>(rp.u||0)){if(!lp.u)lp.u=Date.now();jobs.push(fetch(famUrl("players/"+id),{method:"PUT",body:JSON.stringify(synced(lp))}))}}
    for(const id in S.dead){if(!(RD[id]>=S.dead[id])){jobs.push(fetch(famUrl("dead/"+id),{method:"PUT",body:JSON.stringify(S.dead[id])}));if(RP[id]&&(RP[id].u||0)<=S.dead[id])jobs.push(fetch(famUrl("players/"+id),{method:"DELETE"}))}}
    const rs=await Promise.all(jobs);if(rs.some(x=>!x.ok))throw new Error("write");
    persist();famLast=Date.now();
    if(chg&&!P&&document.querySelector("#np"))home();
  }catch(e){famMsg="Couldn’t reach the family server. It will try again."}
  famBusy=false;if(famAgain){famAgain=false;famSoon()}
}

function perfectDeck(){
const pos=[];ROWS.forEach((xs,row)=>xs.forEach(x=>pos.push({row,x})));
const cov=pos.map(c=>pos.map((o,j)=>o.row==c.row+1&&Math.abs(o.x-c.x)==.5?j:-1).filter(j=>j>=0));
const order=[],gone=new Set();
while(order.length<28){const av=pos.map((_,i)=>i).filter(i=>!gone.has(i)&&cov[i].every(j=>gone.has(j)));const i=av[Math.floor(Math.random()*av.length)];gone.add(i);order.push(i)}
for(;;){const cnt=Array(14).fill(0);let r=1+Math.floor(Math.random()*13);const rk=[r];cnt[r]++;let ok=true;
for(let k=0;k<28;k++){const o=[r%13+1,(r+11)%13+1].filter(x=>cnt[x]<4);if(!o.length){ok=false;break}r=o[Math.floor(Math.random()*o.length)];cnt[r]++;rk.push(r)}
if(!ok)continue;
const left=[];for(let x=1;x<=13;x++)for(let k=cnt[x];k<4;k++)left.push(x);
for(let i=left.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[left[i],left[j]]=[left[j],left[i]]}
const ss={};for(let x=1;x<=13;x++){ss[x]=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ss[x][i],ss[x][j]]=[ss[x][j],ss[x][i]]}}
const mk=x=>({rank:x,suit:SU[ss[x].pop()]}),d=Array(52);
order.forEach((idx,k)=>{d[idx]=mk(rk[k+1])});left.forEach((x,k)=>{d[28+k]=mk(x)});d[51]=mk(rk[0]);return d}}

function fireworks(){killCas();const cv=document.createElement("canvas"),W=cv.width=innerWidth,H=cv.height=innerHeight;cv.id="cas";document.body.append(cv);const x=cv.getContext("2d"),ps=[],C=["#ff0","#f33","#3cf","#fff","#3f6","#f6f"];let f=0;cas={cv,raf:0};
const step=()=>{if(!cas||cas.cv!==cv)return;x.clearRect(0,0,W,H);if(f<200&&f%22==0){const cx=W*(.15+.7*Math.random()),cy=H*(.15+.35*Math.random()),c=C[(Math.random()*6)|0];for(let i=0;i<46;i++){const a=i/46*6.283,v=1.5+Math.random()*3;ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:70,c})}}
for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.l--;if(p.l<=0){ps.splice(i,1);continue}x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)}
f++;if(f<200||ps.length)cas.raf=requestAnimationFrame(step);else killCas()};step()}
